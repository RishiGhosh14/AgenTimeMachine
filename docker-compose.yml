services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_time_machine
      POSTGRES_USER: atm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://atm:change-me@postgres:5432/agent_time_machine}
      PYTHONPATH: /app
    ports: ["8000:8000"]
    depends_on: [postgres]
volumes: { postgres_data: {} }
